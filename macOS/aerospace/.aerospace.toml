
after-login-command = []
after-startup-command = []

start-at-login = true

# Normalisation
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# =========================================================
# KEYBINDINGS
# =========================================================

[mode.main.binding]

# Focus windows — cmd + hjkl
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# Swap windows — cmd + ctrl + hjkl
cmd-ctrl-h = 'move left'
cmd-ctrl-j = 'move down'
cmd-ctrl-k = 'move up'
cmd-ctrl-l = 'move right'

# Resize windows
cmd-shift-h = 'resize width -50'
cmd-shift-l = 'resize width +50'
cmd-shift-k = 'resize height +50'
cmd-shift-j = 'resize height -50'

# Toggle layouts
cmd-slash = 'layout tiles horizontal vertical'
cmd-comma = 'layout accordion horizontal vertical'

# Toggle fullscreen
cmd-f = 'fullscreen'

# Close window
cmd-q = 'close'

# Reload config
cmd-shift-r = 'reload-config'

# Switch workspaces — cmd + 1-0
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'

# Move window to workspace — cmd + shift + 1-0
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 10'

# Launch terminal
cmd-return = 'exec-and-forget open -a iTerm'

# =========================================================
# WORKSPACES
# =========================================================

[[workspaces]]
name = '1'

[[workspaces]]
name = '2'

[[workspaces]]
name = '3'

[[workspaces]]
name = '4'

[[workspaces]]
name = '5'

[[workspaces]]
name = '6'

[[workspaces]]
name = '7'

[[workspaces]]
name = '8'

[[workspaces]]
name = '9'

[[workspaces]]
name = '10'
