# Change prefix to Ctrl+s
set -g prefix C-s
unbind C-b

set -g mouse on               # Enable mouse support
set -g base-index 1           # start window numbering at 1
set -g renumber-windows on    # renumber windows when closing others

# Terminal & cursor
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Ss=\E[6 q:Se=\E[6 q'  # dynamic cursor shape

# Reload config with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# better copying and pasting
set-option -g set-clipboard on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# polling for the status bar every 2 seconds
set -g status-interval 2


# ==========================
# MOVEMENT
# ==========================


# Vim-style pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize windows
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5


# open panes in cwd
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"



# ==========================
# PLUGINS
# ==========================

# Enable TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank' # yank text from tmux to system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/tmux-session-manager' # TUI for switching sessions
set -g @plugin 'jaclu/tmux-menus'

# theme builds its own status-right, so it goes before continuum
set -g @plugin 'dracula/tmux'

# continuum's autosave hook lives in status-right, so keep it last
set -g @plugin 'tmux-plugins/tmux-continuum'

# no longer needed, dracula has its own widgets for these:
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'minhdanh/tmux-network-speed'


# ==========================
# RESURRECTION
# ==========================

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'false'


# ==========================
# STYLING (dracula)
# ==========================

# widgets show left to right in this order
set -g @dracula-plugins "cpu-usage ram-usage network-bandwidth battery uptime"
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-border-contrast true
set -g @dracula-refresh-rate 2

# network-bandwidth needs bc installed: sudo pacman -S bc
# the interface name follows the USB port, so update it if the adapter moves
# set -g @dracula-network-bandwidth wlan0
set -g @dracula-network-bandwidth enp0s20f0u4u4
set -g @dracula-network-bandwidth-interval 1


# =========================
# CONFIGURATION
# =========================

# TPM must be the last line
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.config/tmux/plugins/tpm/tpm'
